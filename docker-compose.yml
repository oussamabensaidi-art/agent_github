# Agent IA de revue des PR — déploiement sur l'infrastructure interne.
#  - api    : reçoit les webhooks GitHub, vérifie la signature, met en file.
#  - worker : dépile et exécute le graphe LangGraph (une analyse à la fois ;
#             scaler avec `docker compose up --scale worker=N`).
#  - redis  : file d'attente + déduplication + diffusion en direct des événements.
#  - db     : journal d'événements des analyses (Postgres), interrupteur, avis.
#  - ollama : modèle local (GPU : ajouter docker-compose.gpu.yml).
# L'interface de suivi est servie par l'api sous /ui (comptes : UI_USERS).
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prreview:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/prreview
    ports:
      - "8020:8020"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://prreview:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/prreview
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - audit:/data
    secrets:
      - github_app.pem
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prreview
      POSTGRES_DB: prreview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prreview -d prreview"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

secrets:
  github_app.pem:
    file: ./secrets/github_app.pem

volumes:
  audit:
  redis:
  pgdata:
  ollama:
